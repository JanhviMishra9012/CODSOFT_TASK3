<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Youtify</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <button class="theme-toggle" id="themeToggle">
    <svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-7.54-7.54c-.44-.06-.9-.1-1.36-.1z"/></svg>
    <span id="themeLabel">🌙</span>
  </button>

  <div class="glass player">
    <div class="art-wrap" id="artWrap"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></div>

    <div class="meta">
      <div class="title" id="trackTitle">Song Title</div>
      <div class="artist" id="trackArtist">Artist Name</div>
    </div>

    <div class="progress-row">
      <span id="curTime">0:00</span>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      </div>
      <span id="durTime">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="shuffleBtn" title="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M17 3h4v4h-2V6.4l-3.6 3.6-1.4-1.4L17.6 5H17V3zM3 5h5.6l7 7-7 7H3v-2h4.8l6-6-6-6H3V5zm14 14h.6l-3-3 1.4-1.4 3.6 3.6V16h2v4h-4v-2z"/></svg>
      </button>
      <button class="ctrl-btn" id="prevBtn" title="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="ctrl-btn play-btn" id="playBtn" title="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="Next">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
      <button class="ctrl-btn" id="repeatBtn" title="Repeat">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>

    <div class="sub-controls">
      <div class="volume-row">
        <button class="ctrl-btn" id="muteBtn" style="width:30px;height:30px;">
          <svg id="volIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        </button>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
      </div>
      <button class="ctrl-btn fav-btn" id="favBtn" title="Favorite">
        <svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.3-8.1C1 10.3 1.8 6.9 4.9 5.6c2-.85 4 .05 5.1 1.7 1.1-1.65 3.1-2.55 5.1-1.7 3.1 1.3 3.9 4.7 2.2 7.3C18.7 16.65 12 21 12 21z"/></svg>
      </button>
    </div>

    <div class="autoplay-row">
      <label class="switch">
        <input type="checkbox" id="autoplayToggle" checked>
        <span class="switch-slider"></span>
      </label>
      <span>Autoplay next track</span>
    </div>
  </div>

  <div class="glass playlist">
    <h3>Playlist</h3>
    <div class="playlist-scroll" id="playlistEl"></div>
  </div>
</div>

<audio id="audio"></audio>

<script src="script.js"></script>
</body>
</html>
